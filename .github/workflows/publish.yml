name: Build and publish the Docker image

permissions:
  id-token: write
  contents: read
  actions: write

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish-to-aws-ecr:
    runs-on: eks-runner-set-arm64
    container:
      image: public.ecr.aws/docker/library/docker:29-cli
    env:
      ENVIRONMENT: prod
      APP_NAME: accounting-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.PUBLICECR_REGION }}

      - name: Authenticate with AWS Public ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registry-type: public

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ vars.PUBLICECR_URI }}:${{ github.ref_name }}
          build-args: |
            ENVIRONMENT=prod
            APP_NAME=accounting-service
            APP_VERSION=${{ github.ref_name }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
